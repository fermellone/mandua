name: Documentation

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check documentation links and metadata without package builds
        run: uv run pytest tests/unit/test_project_metadata.py -q -k "not wheel and not fresh"
