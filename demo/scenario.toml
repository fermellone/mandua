schema_version = "1.0"

[identity]
name = "Mandu'a Demo"
email = "demo@mandua.invalid"

[repository]
canonical_branch = "main"
notes_ref = "refs/notes/review"

[story]
task_id = "TASK-IRR-001"
task_branch = "task/irrigation-review"
decision_id = "DEC-IRR-001"
sensor_hypothesis = "hypothesis/sensor-threshold"
schedule_hypothesis = "hypothesis/fixed-schedule"
deleted_task_branch = "task/untrusted-history"
recovery_branch = "recovery/untrusted-history"

[timestamps]
start = "2026-01-01T00:00:00Z"
step_seconds = 60

[claims]
decision = "decision"
comparison = "comparison"
integration = "integration"
review = "review"
correction = "correction"
deleted_origin = "deleted-origin"
recovery = "recovery"
malicious_history = "malicious-history"

[tutorial]
schema_version = "1.0"
title = "Mandu'a: An Executable Git-Native Memory Tutorial"
introduction = [
  "Mandu'a means to remember in Guarani. This tutorial shows how ordinary Git history can become bounded, verifiable agent memory without an API key or network service.",
  "Every command below comes from this same manifest and is executed in order by the acceptance runner with shell interpretation disabled. Replace the displayed path tokens only with a disposable output directory and this repository's versioned fixture files.",
  "Recorded facts, inferred patch correspondence, missing reasons, and bounded-history limits remain separate kinds of evidence throughout the walkthrough.",
]
canonical_claims = [
  "decision",
  "comparison",
  "integration",
  "review",
  "correction",
  "deleted_origin",
  "recovery",
  "malicious_history",
]

[tutorial.claims]
missing_reason = "missing-reason"
inferred_correspondence = "inferred-correspondence"
history_limit = "history-limit"

[tutorial.limits]
max_commands = 96
max_step_commands = 24
max_argument_count = 32
max_argument_bytes = 16384
max_command_output_bytes = 524288
max_total_output_bytes = 4194304
timeout_seconds = 30

[[tutorial.steps]]
id = "baseline"
title = "Initialize the repository and record a semantic baseline"
explanation = "Create a disposable repository, copy the versioned policy and garden observations, then record a deterministic semantic commit with explicit reason and trailers."
expected_evidence = [
  "The repository starts on main with one baseline commit.",
  "The commit records Memory-Type, Scope, Task-ID, Agent-ID, and an explicit Reason paragraph.",
]
claims = []

[[tutorial.steps.commands]]
id = "initialize-output"
cwd = "{{OUTPUT}}"
argv = ["mkdir", "-p", "repository/knowledge"]
expected_exit = 0

[[tutorial.steps.commands]]
id = "initialize-repository"
cwd = "{{REPO}}"
argv = ["git", "init", "--initial-branch=main", "."]
expected_exit = 0

[[tutorial.steps.commands]]
id = "install-policy"
cwd = "{{REPO}}"
argv = ["cp", "{{FIXTURE_CONFIG}}", ".mandua.toml"]
