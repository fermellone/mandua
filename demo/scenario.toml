[[tutorial.steps]]
id = "compare-integrate-review"
title = "Query evidence, integrate one hypothesis, and attach review memory"
explanation = "Mandu'a first reports recorded branch facts and separately labels same-patch correspondence as inference. It then previews and applies the sensor integration and review note without hiding either write behind an implicit mutation."
expected_evidence = [
  "The hypothesis comparison names a merge base and both immutable tips as recorded facts.",
  "The replay comparison reports patch correspondence only as inference.",
  "The fixed-schedule line reports that no reason was recorded and returns no inferred reason.",
  "Integration and annotation previews are followed by explicit --apply commands.",
]
claims = [
  "comparison",
  "inferred_correspondence",
  "missing_reason",
  "integration",
  "review",
]

[[tutorial.steps.commands]]
id = "compare-hypotheses"
cwd = "{{OUTPUT}}"
argv = ["mandua", "--repo", "{{REPO}}", "compare", "hypothesis/sensor-threshold", "hypothesis/fixed-schedule", "--path", "knowledge/irrigation-rules.json", "--format", "json"]
